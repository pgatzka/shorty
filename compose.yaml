# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: shorty
      POSTGRES_USER: shorty
      POSTGRES_PASSWORD: shorty
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shorty-dev-db:/var/lib/postgresql
volumes:
  shorty-dev-db:
