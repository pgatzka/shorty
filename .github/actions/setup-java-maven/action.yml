name: Set up Java and Maven
description: Temurin JDK 25 with a Maven dependency cache, shared by all workflows.

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "25"
        cache: maven
